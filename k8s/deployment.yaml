apiVersion: apps/v1
 kind:Deployment
metadata:
  name: devops-java-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-java-app
  template :
    metadata:
      labels:
        app: devops-java-app
    spec :
      containers :
        - name : devops-java-app
          image : 551647579930.dkr.ecr.ap-south-1.amazonaws.com/devops-java-app:1.0
          ports:
            - containerPort : 8080
          LivenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds : 10


